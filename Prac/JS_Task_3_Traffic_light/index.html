
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <table id="signals">
            <tr>
                <td rowspan="2" colspan="2"></td>
                <td colspan="3" id="NT">NT</td>
                <td rowspan="2" colspan="2"></td>
            </tr>
            <tr>
                <td id="NR">NR</td>
                <td id="NG">NG</td>
                <td id="NY">NY</td>
            </tr>
            <tr>
                <td rowspan="3" id="WT">WT</td>
                <td id="WY">WY</td>
                <td rowspan="3" colspan="3" id="XT"></td>
                <td id="ER">ER</td>
                <td rowspan="3" id="ET">ET</td>
            </tr>
            <tr>
                <td id="WG">WG</td>
                <td id="EG">EG</td>
            </tr>
            <tr>
                <td id="WR">WR</td>
                <td id="EY">EY</td>
            </tr>
            <tr>
                <td rowspan="2" colspan="2"></td>
                <td id="SY">SY</td>
                <td id="SG">SG</td>
                <td id="SR">SR</td>
                <td rowspan="2" colspan="2"></td>
            </tr>
            <tr>
                <td colspan="3" id="ST">ST</td>
            </tr>
        </table>
    </div>
</body>
<script src="script.js"></script>
</html>
